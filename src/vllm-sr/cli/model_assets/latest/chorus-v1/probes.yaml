schema_version: v1
name: chorus-v1
description: Capability and context routing probes for all five vLLM-SR Chorus V1 entrypoints.
routing_assets:
  yaml: config/built-in/latest/chorus-v1/config.yaml
  dsl: config/built-in/latest/chorus-v1/recipe.dsl
router_eval_endpoint: /api/v1/eval
evaluation:
  request_timeout_seconds: 300
  concurrency: 4
acceptance:
  min_probe_pass_rate: 100.0
  min_decision_pass_rate: 100.0
coverage:
  min_signal_assertion_percent: 100.0
  min_projection_assertion_percent: 100.0
  min_algorithm_assertion_percent: 100.0
  min_plugin_assertion_percent: 100.0
  required_request_shapes:
  - text
  - messages
  - tools
  min_tag_counts:
    language: 220
    negative: 32
    collision: 70
    stress: 65
    tools: 50
    multi_turn: 70
  min_tag_pass_rate:
    language: 100.0
    negative: 100.0
    collision: 100.0
    stress: 100.0
    tools: 100.0
    multi_turn: 100.0
decisions:
- id: balance_over_240k_image_guard
  model: vllm-sr/chorus-v1
  expected_recipe: balance
  expected_decision: balance_over_240k_image_guard
  expected_algorithm: static
  expected_plugins:
  - system_prompt
  expected_alias: local/qwen3.6-35b
  notes: Eval proves modality-preserving routing and GLM exclusion; Qwen36 enforces true native-262K overflow because the router has no reject decision.
  variants:
  - id: image_at_first_over_240k_token
    display_prompt: Analyze the attached image at the 240K context boundary and explain the most important visual finding.
    playground:
      enabled: false
      reason: This synthetic long-context boundary fixture is expanded only during Eval and is intentionally disabled in Playground.
