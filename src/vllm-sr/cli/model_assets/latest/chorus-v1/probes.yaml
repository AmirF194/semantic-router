  expected_algorithm: static
  expected_plugins:
  - system_prompt
  expected_alias: local/glm-5.2
  variants:
  - id: text_at_first_over_240k_band
    display_prompt: Summarize the key decisions in this long neutral record while preserving its factual constraints.
    playground:
      enabled: false
      reason: This synthetic long-context boundary fixture is expanded only during Eval and is intentionally disabled in Playground.
    query: Summarize this text using the supported terminal lane.
    padding:
      text: 'Neutral capacity record without image or routing intent. Neutral capacity record without image or routing intent. '
      repeat: 9000
      placement: after
    expected_signals:
      context:
      - speed_exceeds_240k_context
