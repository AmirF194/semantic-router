      enabled: false
      reason: This synthetic long-context boundary fixture is expanded only during Eval and is intentionally disabled in Playground.
    query: Break this into independent workstreams, then use the inventory lookup tool.
    padding:
      text: Neutral long-context capacity payload without images or routing intent. Neutral long-context capacity payload without images or routing intent. Neutral long-context capacity payload without images or routing intent. Text now.
